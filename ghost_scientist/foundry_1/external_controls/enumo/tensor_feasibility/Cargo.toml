[package]
name = "foundry_enumo_tensor_feasibility"
version = "0.1.0"
edition = "2021"
publish = false

[[bin]]
name = "foundry-enumo-tensor-feasibility"
path = "src/main.rs"

[dependencies]
egg = { path = "../egg_control" }
ruler = { package = "foundry_enumo_source_control", path = "../control" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
