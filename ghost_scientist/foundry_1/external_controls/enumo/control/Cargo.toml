[package]
name = "foundry_enumo_source_control"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
name = "ruler"
path = "generated/lib.rs"

[[bin]]
name = "foundry-enumo-control"
path = "src/main.rs"

[dependencies]
egg = { path = "../egg_control" }
indexmap = "1"
itertools = "0.12"
rayon = "1"
rustc-hash = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
symbolic_expressions = { path = "../../babble/symbolic_expressions" }
