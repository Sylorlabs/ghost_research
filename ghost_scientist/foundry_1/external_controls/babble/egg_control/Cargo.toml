[package]
name = "egg"
version = "0.7.1"
edition = "2018"
publish = false

[lib]
path = "../egg/src/lib.rs"

[dependencies]
symbolic_expressions = { path = "../symbolic_expressions" }
log = "0.4"
smallvec = { version = "1", features = ["union", "const_generics"] }
indexmap = "1"
instant = { path = "../instant" }
once_cell = "1"
fxhash = "0.2"
hashbrown = { version = "0.12", default-features = false, features = ["inline-more"] }
thiserror = "1"

[features]
default = []
wasm-bindgen = []
serde-1 = []
reports = []
test-explanations = []
