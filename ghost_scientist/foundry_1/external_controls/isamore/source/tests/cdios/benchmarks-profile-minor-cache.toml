[cdios]
path = "./benchmarks"
target_path = "./profiled-minor-cache"
compile_rvsdg = true
instrument = true
profile = true
cflags = "-O2 -fno-vectorize -fno-slp-vectorize -ffp-contract=off"

[cdios.instrument_options]
temp-path = "__temp_minor_cache"
keep-temps = true

[cdios.profile_options]
temp-path = "__temp_minor_cache"
cpu-type = "minor"
cache-hierarchy = "private_l1"

[comment]
example = "python3 scripts/preprocess.py --config tests/cdios/benchmarks-profile-minor-cache.toml --instrument-path $INSTRUMENT_PATH --llvm $JLM_LLVM --clang=$JLM_LLVM/bin/clang-18 --jlm-opt=$JLM_BUILD/jlm-opt"
note = "Set environment variables JLM_BUILD (path to jlm build directory) and JLM_LLVM (path to llvm directory) or use --llvm, --clang, --jlm-opt arguments"
